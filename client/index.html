<style>
#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .28s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:96px;height:96px;object-fit:contain;animation:splashPulse 1.4s ease-in-out infinite}
@keyframes splashPulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}}
</style>

<body>
<div id="splash" aria-hidden="true"><img src="icon-192.png" alt="" width="96" height="96"></div>
<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="site-config.js"></script>
<script src="xmas.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
<script src="desktop.js"></script>
<script>
// Úvodní černá obrazovka s logem: stránka se ukáže až když je načtená (písmo, logo, panely na PC),
// nejdéle po 1 s — nic neskáče do hotového okna.
(function () {
  var el = document.getElementById('splash');
  if (!el) return;
  var t0 = Date.now(), done = false;
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  function hide() {
    if (done) return; done = true;
    el.classList.add('out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
  }
  if (standalone) { hide(); return; }               // v nainstalované aplikaci ukazuje úvodní obrazovku už systém
  var loaded = document.readyState === 'complete';
  if (!loaded) window.addEventListener('load', function () { loaded = true; });
  var fontsOk = !(document.fonts && document.fonts.ready);
  if (!fontsOk) document.fonts.ready.then(function () { fontsOk = true; }, function () { fontsOk = true; });
  var wantPanels = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine) and (min-width:1060px)').matches;
  (function poll() {
    var el2 = Date.now() - t0;
    var ready = loaded && fontsOk && (!wantPanels || window.__menuDataReady);
    if ((ready && el2 >= 300) || el2 >= 1000) { requestAnimationFrame(hide); return; }
    setTimeout(poll, 40);
  })();
})();
</script>
